[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-research-lab"
version = "0.1.0"
description = "Chronological industry-signal research with execution accounting and selection-aware inference"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7", "requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.8", "nbformat>=5", "ipykernel>=6"]

[project.scripts]
alpha-research = "alpha_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

